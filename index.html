<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Comandi e tasti del server Diamond RP">
<title>Comandi Diamond RP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: banda titolo + barra filtri fissa, poi indice categorie a sinistra e schede script a destra (una colonna sul telefono). Stile Facet di Diamond RP, solo scuro. */
:root{
  --bg:#0c0d09; --panel:#15140f; --well:#0b0b08;
  --ink:#f1f0e9; --ink2:#d4d2c7; --mute:#a3a092; --faint:#858275;
  --hair:rgba(241,240,233,.12); --hair2:rgba(241,240,233,.22);
  --lime:#beee11; --lime-hi:#d3ff3d; --lime-ink:#12140a;
  --job:#b28cff; --admin:#ff5467; --warn:#ffc23d;
  --brand:linear-gradient(90deg,#a855f7 0%,#fc2d84 38%,#fb7a2c 68%,#ffd23f 100%);
  --f-title:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-num:'JetBrains Mono',Consolas,ui-monospace,monospace;
  --cut:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
.brandline{height:3px;background:var(--brand);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
header.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-title);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--lime)}
h1{font-family:var(--f-title);font-style:italic;font-weight:700;text-transform:uppercase;font-size:clamp(30px,5vw,46px);line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.lede{color:var(--mute);margin:10px 0 0;max-width:62ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));padding:10px 14px;min-width:96px}
.stat b{display:block;font-family:var(--f-num);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--well);border:1px solid var(--hair2);padding:0 12px;height:40px}
.search:focus-within{border-color:var(--lime)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-family:var(--f-num);font-size:14px}
.search input::placeholder{color:var(--faint)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{font-family:var(--f-title);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;height:40px;padding:0 14px;border:1px solid var(--hair2);background:var(--panel);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.seg button:focus-visible,.chips button:focus-visible,.cmd:focus-visible{outline:2px solid var(--lime-hi);outline-offset:2px}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;margin-top:22px}
nav.cats{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.cats a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;color:var(--ink2);text-decoration:none;font-family:var(--f-title);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:13px;border-left:2px solid transparent}
nav.cats a:hover{color:var(--ink);border-left-color:var(--hair2)}
nav.cats a.on{color:var(--lime);border-left-color:var(--lime)}
nav.cats a i{font-style:normal;font-family:var(--f-num);color:var(--faint);font-size:12px}
.legend{margin-top:18px;padding:12px 10px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px;color:var(--mute);font-size:12px}

section.cat{scroll-margin-top:80px}
section.cat + section.cat{margin-top:34px}
.cat > h2{font-family:var(--f-title);font-style:italic;font-weight:700;text-transform:uppercase;font-size:24px;margin:0 0 12px;display:flex;align-items:baseline;gap:12px}
.cat > h2 small{font-family:var(--f-num);font-style:normal;font-weight:500;font-size:12px;color:var(--faint)}
.script{background:var(--panel);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.script + .script{margin-top:10px}
.script header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--hair)}
.script header h3{margin:0;font-family:var(--f-title);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.script header code{font-family:var(--f-num);font-size:12px;color:var(--faint)}
.script header p{flex-basis:100%;margin:2px 0 0;color:var(--mute);font-size:13px}
.row{display:grid;grid-template-columns:minmax(150px,240px) 92px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:9px 16px;border-top:1px solid var(--hair)}
.row:first-of-type{border-top:0}
.cmd{font-family:var(--f-num);font-weight:600;font-size:13.5px;color:var(--lime);background:none;border:0;padding:0;text-align:left;cursor:copy;overflow-wrap:anywhere}
.cmd .p{color:var(--mute);font-weight:500}
.cmd.key{color:var(--ink);cursor:default}
.who{justify-self:start;font-family:var(--f-title);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.who.all{color:var(--lime)} .who.job{color:var(--job)} .who.admin{color:var(--admin)} .who.unk{color:var(--mute);border-style:dashed}
.toggle{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px;color:var(--ink2);font-size:13px;cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--lime);margin:0}
details.issues{border:1px solid rgba(190,238,17,.4);background:rgba(190,238,17,.05);margin-bottom:26px}
details.issues summary{cursor:pointer;padding:12px 16px;font-family:var(--f-title);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--lime)}
details.issues summary:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
details.issues ul{margin:0;padding:0 16px 14px 34px;display:grid;gap:8px}
details.issues li{color:var(--ink2);max-width:90ch}
details.issues li b{color:var(--ink);font-weight:600}
.desc{color:var(--ink2);min-width:0}
.desc .jobname{color:var(--job);font-weight:600}
.desc .note{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.kbd{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
kbd{font-family:var(--f-num);font-size:12px;background:var(--well);border:1px solid var(--hair2);border-bottom-width:2px;padding:1px 7px;color:var(--ink);white-space:nowrap}
.tag{font-family:var(--f-num);font-size:11px;color:var(--warn);border:1px dashed var(--warn);padding:0 5px;margin-left:6px;vertical-align:1px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--lime-ink);font-family:var(--f-title);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{margin-top:40px;color:var(--faint);font-size:12px;border-top:1px solid var(--hair);padding-top:14px}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.cats{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  nav.cats a{border-left:0;border:1px solid var(--hair2);padding:6px 10px}
  .legend{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .desc{grid-column:1 / -1}
  .row .kbd{grid-column:1 / -1;justify-content:flex-start}
  .row .kbd:empty{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="brandline"></div>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Diamond RP · Guida per i giocatori</div>
      <h1>Comandi del server</h1>
      <p class="lede">Tutti i comandi e i tasti che puoi usare in città, anche quelli dei lavori. Clicca un comando per copiarlo.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"/></svg>
      <input id="q" type="search" placeholder="Cerca: casa, radio, animazioni, F5…" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="Chi può usarlo">
      <button type="button" data-who="" aria-pressed="true">Tutto</button>
      <button type="button" data-who="all" aria-pressed="false">Giocatori</button>
      <button type="button" data-who="job" aria-pressed="false">Lavori</button>
      
    </div>
    
  </div>

  <div class="layout">
    <nav class="cats" id="cats" aria-label="Categorie"></nav>
    <main id="list"></main>
  </div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast">Copiato</div>

const DATA = __D.DATA, ISSUES = __D.ISSUES, NOTES = __D.NOTES;
/*END DATA*/

const WHO = { all: 'Tutti', job: 'Lavoro', admin: 'Admin', unk: 'Da provare' };
const state = { q: '', who: '', test: false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = s => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function rows() {
  const out = [];
  for (const cat of DATA) for (const s of cat.scripts) for (const r of s.cmds) out.push({ cat, s, r });
  return out;
}
function matches(cat, s, r) {
  if (r.test && !state.test) return false;
  if (state.who && r.who !== state.who) return false;
  if (!state.q) return true;
  const hay = [cat.name, s.name, s.res, s.about, r.c, r.p, r.d, r.job, r.note, (r.key || []).join(' ')].join(' ').toLowerCase();
  return state.q.split(/\s+/).every(t => hay.includes(t));
}
function stats() {
  const all = rows(), live = all.filter(x => !x.r.test);
  const n = w => live.filter(x => x.r.who === w && x.r.c).length;
  $('#stats').innerHTML = [
    [live.filter(x => x.r.c).length, 'comandi'], [n('all'), 'giocatori'], [n('job'), 'lavori'], 
    [live.filter(x => !x.r.c).length, 'tasti']
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}
function render() {
  let html = '', nav = '', total = 0;
  for (const cat of DATA) {
    let catHtml = '', count = 0;
    for (const s of cat.scripts) {
      const list = s.cmds.filter(r => matches(cat, s, r));
      if (!list.length) continue;
      count += list.length;
      catHtml += `<article class="script"><header><h3>${esc(s.name)}</h3><code>${esc(s.res)}</code>${s.about ? `<p>${esc(s.about)}</p>` : ''}</header>` +
        list.map(r => {
          const cmd = r.c
            ? `<button type="button" class="cmd" data-copy="${esc(r.c)}" title="Copia ${esc(r.c)}">${esc(r.c)}${r.p ? ` <span class="p">${esc(r.p)}</span>` : ''}</button>`
            : `<span class="cmd key">${esc(r.label || 'Tasto')}</span>`;
          const who = `<span class="who ${r.who}">${WHO[r.who]}</span>`;
          const desc = `<div class="desc">${r.job ? `<span class="jobname">${esc(r.job)}</span> · ` : ''}${esc(r.d)}${r.test ? '<span class="tag">test</span>' : ''}${r.note ? `<span class="note">${esc(r.note)}</span>` : ''}</div>`;
          const keys = `<div class="kbd">${(r.key || []).map(k => `<kbd>${esc(k)}</kbd>`).join('')}</div>`;
          return `<div class="row">${cmd}${who}${desc}${keys}</div>`;
        }).join('') + `</article>`;
    }
    if (!count) continue;
    total += count;
    const id = slug(cat.name);
    html += `<section class="cat" id="${id}"><h2>${esc(cat.name)} <small>${count}</small></h2>${catHtml}</section>`;
    nav += `<a href="#${id}">${esc(cat.name)} <i>${count}</i></a>`;
  }
  const issues = state.q ? '' : `<details class="issues" id="issues"${issuesOpen ? ' open' : ''}><summary>Tasti cambiati il 22/10 · ${ISSUES.length}</summary><ul>${ISSUES.map(([t, d]) => `<li><b>${esc(t)}:</b> ${esc(d)}</li>`).join('')}</ul></details>`;
  $('#list').innerHTML = issues + (html || `<div class="empty">Nessun comando trovato${state.q ? ` per “${esc(state.q)}”` : ''}. Prova con un'altra parola o togli il filtro.</div>`);
  const det = $('#issues'); if (det) det.addEventListener('toggle', () => { issuesOpen = det.open; });
  $('#cats').innerHTML = nav + `<div class="legend"><span><span class="who all">Tutti</span> qualsiasi giocatore</span><span><span class="who job">Lavoro</span> solo chi ha quel lavoro</span></div>`;
}

let issuesOpen = true;
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.who = b.dataset.who;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
let toastT;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { const t = $('#toast'); t.textContent = 'Copiato ' + text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1400); };
  try {
    navigator.clipboard.writeText(text).then(done, () => { selectText(b); });
  } catch (_) { selectText(b); }
});
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

stats();
render();
$('#foot').innerHTML = `Aggiornato al ${esc(NOTES.updated)}. ${NOTES.extra.map(esc).join(' ')}`;
</script>
